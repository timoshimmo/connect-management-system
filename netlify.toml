[build]
  base = "frontend"
  # Fix: Modified to run frontend's build script directly inside this directory
  command = "npm install --prefix ../backend && npm run build"
  publish = "dist"

[build.processing]
  # CRITICAL FIX: Forces Netlify to bypass its automatic cancel/skip checks 
  # when it detects zero changes inside the "frontend" directory.
  ignore = "exit 1"

[functions]
  directory = "../backend/functions"
  node_bundler = "esbuild"
  external_node_modules = [
    "serverless-http",
    "@aws-sdk/client-s3",
    "bcrypt",
    "compression",
    "cookie-parser",
    "cors",
    "dotenv",
    "express",
    "express-rate-limit",
    "helmet",
    "jsonwebtoken",
    "mongoose",
    "multer",
    "nodemailer",
    "pino",
    "pino-http",
    "swagger-jsdoc",
    "swagger-ui-express",
    "zod"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

